name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Conversor (Node)
        run: node --test "GlbExport/test/*.test.cjs"
      - name: Opciones y JSON (.NET)
        run: dotnet test tests/GlbExport.Tests -nologo
      - name: Compilar add-in para Revit 2023-2027
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: addin-unsigned
          path: dist/addin

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write   # SignPath / firma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Compilar add-in
        shell: pwsh
        run: ./build.ps1

      # Firma: Smart App Control bloquea DLL sin firma de una CA publica. Se activa cuando existan los secretos
      # SIGNPATH_API_TOKEN (y las variables SIGNPATH_ORG_ID, SIGNPATH_PROJECT, SIGNPATH_POLICY). Ver README.
      - name: Subir DLL para firmar
        if: vars.SIGNPATH_ORG_ID != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: dlls-unsigned
          path: dist/addin
      - name: Firmar con SignPath
        if: vars.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/addin-signed
      - name: Usar DLL firmadas
        if: vars.SIGNPATH_ORG_ID != ''
        shell: pwsh
        run: |
          Remove-Item dist/addin -Recurse -Force
          Move-Item dist/addin-signed dist/addin

      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar instalador
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\GLBExport.iss
      - name: Hash SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
